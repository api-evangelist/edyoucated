aid: edyoucated
name: Edyoucated
description: >-
  Edyoucated is a German SaaS company offering an AI-powered corporate learning
  and skills-management platform for mid-to-large enterprises. The product combines a
  learning management / learning experience system (central management of training,
  mandatory compliance training, seminar administration, AI-assisted content creation,
  blended learning, and learning analytics) with skills management (skill cataloging,
  assessments, gap analysis, expert identification, and career guidance) to give
  organizations a common language for skills and personalized learning pathways. It
  also offers consulting for custom skill-taxonomy development. Customers include
  Deutsche Bahn, BASF, Shopware, and Finanz Informatik. Edyoucated is a portfolio
  company of Earlybird Venture Capital. As of this profile the company publishes no
  public developer/API surface, developer portal, OpenAPI, or documentation.
